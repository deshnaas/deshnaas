<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Voxera — multilingual, voice-first AI rural healthcare and care-coordination platform. Call, language, triage, safety check, care and referral, follow-up.">
<title>Voxera — multilingual, voice-first AI rural healthcare and care-coordination platform. Call, language, triage, safety check, care and referral, follow-up.</title>
<defs>
