<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="02 — About">
<title>02 — About</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0C1424"/><stop offset="1" stop-color="#060912"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E6D3A3"/><stop offset="0.55" stop-color="#C9A961"/><stop offset="1" stop-color="#A8873F"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C9A961" stop-opacity="0.9"/><stop offset="1" stop-color="#C9A961" stop-opacity="0"/>
  </linearGradient>
<linearGradient id="shineW" gradientUnits="userSpaceOnUse" x1="-280" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F2F0EA"/><stop offset="0.5" stop-color="#C9A961"/><stop offset="1" stop-color="#F2F0EA"/><animate attributeName="x1" values="-280;1200;1200" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1480;1480" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/></linearGradient><clipPath id="frame"><rect x="1" y="1" width="1198" height="102" rx="14"/></clipPath></defs>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run{animation:run 7s linear infinite}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.float{animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(36px,-22px)}}
.wave{animation:wave 10s linear infinite}
@keyframes wave{to{transform:translateX(-600px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 7s ease-out infinite}
@keyframes ping{0%{opacity:.9;transform:scale(1)}14%{opacity:0;transform:scale(2.1)}100%{opacity:0;transform:scale(2.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.up{opacity:1}}
</style>
<rect x="1" y="1" width="1198" height="102" rx="14" fill="url(#bg)" stroke="#1E2A44" stroke-opacity="1.0" stroke-width="1.5"/>
<text x="44" y="62" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="400" fill="#C9A961" letter-spacing="0" text-anchor="start" font-style="italic" class="breathe">02</text><text x="104" y="62" font-family="Georgia, 'Times New Roman', Times, serif" font-size="32" font-weight="400" fill="url(#shineW)" letter-spacing="5" text-anchor="start" class="up" style="animation-delay:0.1s">ABOUT</text><text x="1156" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8D97AB" letter-spacing="4" text-anchor="end" class="up" style="animation-delay:0.4s">ENGINEERING PHILOSOPHY</text><rect x="44" y="84" width="1112" height="1.5" fill="url(#fade)"/><path d="M44 84.75H1156" stroke="#E6D3A3" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="5 95" class="run" style="animation-duration:5s"/>

</svg>
