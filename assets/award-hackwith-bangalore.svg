pple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A961" letter-spacing="6" text-anchor="start" class="up" style="animation-delay:0s">AWARD</text><circle cx="528" cy="60" r="24" fill="#0E1626" stroke="url(#gold)" stroke-width="1.5"/><circle cx="528" cy="60" r="31" fill="none" stroke="#C9A961" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round" class="spin"/><text x="528" y="69" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" font-weight="400" fill="#E6D3A3" letter-spacing="0" text-anchor="middle" >2</text><text x="44" y="190" font-family="Georgia, 'Times New Roman', Times, serif" font-size="80" font-weight="400" fill="url(#shineG)" letter-spacing="0" text-anchor="start" class="up" style="animation-delay:0.2s">Runner-Up</text><text x="46" y="244" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F0EA" letter-spacing="4.5" text-anchor="start" class="up" style="animation-delay:0.5s">HACKWITH BANGALORE</text><rect x="46" y="266" width="64" height="2" fill="url(#gold)" class="up" style="animation-delay:0.7s"/><text x="46" y="308" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#B4BCCB" letter-spacing="0" text-anchor="start" class="up" style="animation-delay:0.8s">Hosted at the Microsoft Bengaluru office.</text>
