<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 52" width="216" height="52" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0C1424"/><stop offset="1" stop-color="#060912"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E6D3A3"/><stop offset="0.55" stop-color="#C9A961"/><stop offset="1" stop-color="#A8873F"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C9A961" stop-opacity="0.9"/><stop offset="1" stop-color="#C9A961" stop-opacity="0"/>
  </linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="214" height="50" rx="26"/></clipPath></defs>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run{animation:run 7s linear infinite}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.float{animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(36px,-22px)}}
.wave{animation:wave 10s linear infinite}
@keyframes wave{to{transform:translateX(-600px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 7s ease-out infinite}
@keyframes ping{0%{opacity:.9;transform:scale(1)}14%{opacity:0;transform:scale(2.1)}100%{opacity:0;transform:scale(2.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.up{opacity:1}}
</style>
<rect x="1" y="1" width="214" height="50" rx="26" fill="url(#bg)" stroke="#C9A961" stroke-opacity="0.55" stroke-width="1.5"/>
<g transform="translate(24 14) scale(1.0)" fill="none" stroke="#E6D3A3" color="#E6D3A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4.2" ry="9.5"/><path d="M2.5 12h19"/></g><text x="60" y="31.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F2F0EA" letter-spacing="3.2" text-anchor="start" >PORTFOLIO</text>
<rect x="1" y="1" width="214" height="50" rx="26" fill="none" stroke="#E6D3A3" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" class="run" style="animation-duration:4s" stroke-width="5" stroke-opacity="0.18"/><rect x="1" y="1" width="214" height="50" rx="26" fill="none" stroke="#E6D3A3" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" class="run" style="animation-duration:4s" stroke-width="1.8"/>
</svg>
